# Alembic configuration for ThreatScope AI
# https://alembic.sqlalchemy.org/en/latest/

[alembic]
# Path to migration scripts
script_location = alembic

# sys.path prepend (ensures app package is importable)
prepend_sys_path = .

# Template for generating new migration files
# file_template = %%(rev)s_%%(slug)s

# Placeholder — overridden at runtime by env.py
sqlalchemy.url = driver://user:pass@localhost/dbname

[post_write_hooks]
# Uncomment to auto-format generated migrations with black:
# hooks = black
# black.type = console_scripts
# black.entrypoint = black
# black.options = -q

# ── Logging ──────────────────────────────────────────────────
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
