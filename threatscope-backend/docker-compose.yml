version: "3.9"

services:
  # ─────────────────────────────────────────────
  # FastAPI Application Server
  # ─────────────────────────────────────────────
  api:
    build: .
    container_name: threatscope-api
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8000:8000"
    volumes:
      - .:/app
      - yara_rules_data:/app/yara_rules
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - threatscope-net
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  # ─────────────────────────────────────────────
  # RQ Async Worker (default)
  # ─────────────────────────────────────────────
  worker:
    build: .
    container_name: threatscope-worker
    command: python -m app.worker default
    volumes:
      - .:/app
      - yara_rules_data:/app/yara_rules
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - threatscope-net
    healthcheck:
      test: ["CMD", "python", "-c", "from rq import Worker; from redis import Redis; print(len(Worker.all(connection=Redis(host='redis'))))"]
      interval: 15s
      timeout: 5s
      retries: 3
    restart: unless-stopped


  # ─────────────────────────────────────────────
  # PostgreSQL 16 Database
  # ─────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    container_name: threatscope-db
    environment:
      POSTGRES_USER: threatscope
      POSTGRES_PASSWORD: password
      POSTGRES_DB: threatscope
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U threatscope"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - threatscope-net
    restart: unless-stopped

  # ─────────────────────────────────────────────
  # Redis 7 (RQ broker + result backend)
  # ─────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: threatscope-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - threatscope-net
    restart: unless-stopped

  # ─────────────────────────────────────────────
  # MinIO Object Storage
  # ─────────────────────────────────────────────
  minio:
    image: minio/minio:latest
    container_name: threatscope-minio
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9000/minio/health/live || wget -O /dev/null -q http://localhost:9000/minio/health/live || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - threatscope-net
    restart: unless-stopped

  # ─────────────────────────────────────────────
  # Ollama — Local LLM for AI Explanations
  # ─────────────────────────────────────────────
  ollama:
    image: ollama/ollama:latest
    container_name: threatscope-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:11434/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
    networks:
      - threatscope-net
    restart: unless-stopped

  # ─────────────────────────────────────────────
  # RQ Scheduler (weekly YARA updates, etc.)
  # ─────────────────────────────────────────────
  scheduler:
    build: .
    container_name: threatscope-scheduler
    command: rqscheduler -H redis -p 6379 -d 0
    volumes:
      - .:/app
      - yara_rules_data:/app/yara_rules
    env_file:
      - .env
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - threatscope-net
    healthcheck:
      test: ["CMD", "python", "-c", "from redis import Redis; r = Redis(host='redis'); print(r.ping())"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

volumes:
  pgdata:
    driver: local
  miniodata:
    driver: local
  ollama_data:
    driver: local
  yara_rules_data:
    driver: local

networks:
  threatscope-net:
    driver: bridge
