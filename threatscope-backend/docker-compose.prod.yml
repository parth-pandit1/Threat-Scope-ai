version: "3.9"

services:
  # ─────────────────────────────────────────────
  # FastAPI Application Server (Production)
  # ─────────────────────────────────────────────
  api:
    build: .
    container_name: threatscope-api-prod
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    volumes:
      - yara_rules_data:/app/yara_rules
    env_file:
      - .env
    networks:
      - threatscope-prod-net
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 20s
      timeout: 10s
      retries: 3
    restart: always

  # ─────────────────────────────────────────────
  # RQ Async Worker (Default queue)
  # ─────────────────────────────────────────────
  worker:
    build: .
    container_name: threatscope-worker-prod
    command: python -m app.worker default
    volumes:
      - yara_rules_data:/app/yara_rules
    env_file:
      - .env
    networks:
      - threatscope-prod-net
    restart: always

  # ─────────────────────────────────────────────
  # RQ Async Worker (Screenshots queue)
  # ─────────────────────────────────────────────
  screenshot-worker:
    build: .
    container_name: threatscope-screenshot-worker-prod
    command: python -m app.worker screenshots
    volumes:
      - yara_rules_data:/app/yara_rules
    env_file:
      - .env
    networks:
      - threatscope-prod-net
    restart: always

  # ─────────────────────────────────────────────
  # YARA Scheduler / Rule Updater
  # ─────────────────────────────────────────────
  yara-updater:
    build: .
    container_name: threatscope-yara-updater-prod
    command: python -c "import time; from app.tasks.yara_tasks import update_yara_rules; [ (update_yara_rules(), time.sleep(86400)) for _ in iter(int, 1) ]"
    volumes:
      - yara_rules_data:/app/yara_rules
    env_file:
      - .env
    networks:
      - threatscope-prod-net
    restart: always

networks:
  threatscope-prod-net:
    driver: bridge

volumes:
  yara_rules_data:
